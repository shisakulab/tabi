<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 日本の外の地図（OpenFreeMap、maplibre-gl）は cdn.jsdelivr.net から読み込み、tiles.openfreemap.org に問い合わせる -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://cyberjapandata.gsi.go.jp https://upload.wikimedia.org; connect-src 'self' https://cdn.jsdelivr.net https://tiles.openfreemap.org; worker-src 'self' blob:; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅暦">
<title>旅暦｜温泉・世界遺産・御朱印の季節の判子帳</title>
<meta name="description" content="見頃の月に行くと季節の判子がもらえる、旅の判子帳。世界遺産・国宝・100名城・一宮・道の駅などをめぐり、御朱印などの記録を残す、無料・登録不要のスマホ向け Web アプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="vendor/leaflet.js"></script>
</head>
<body>
<main id="view" class="view"><div id="map"></div></main>
<div class="hud">
  <button id="quest" class="quest" type="button"></button>
  <div id="near" class="near" hidden></div>
  <div id="modes" class="modes" role="group" aria-label="旅のしかた"></div>
</div>
<nav id="fab" class="fab" aria-label="メニュー">
  <button type="button" class="rbtn" data-open="book">帳面</button>
  <button type="button" class="rbtn main" data-open="record" aria-label="印を記録する">＋</button>
  <button type="button" class="rbtn" data-open="diary">日記</button>
</nav>
<div class="legend" aria-label="判子の色">
  <span><i style="--c:var(--seal)"></i>見頃</span>
  <span><i style="--c:var(--list)"></i>名所</span>
  <span><i style="--c:var(--near)"></i>近所</span>
  <span><i class="ring dash"></i>まだ</span>
  <span><i class="ring"></i>通った</span>
  <span><b class="minihanko">印</b>押した</span>
</div>
<button id="settings" class="locate gear" type="button" aria-label="設定"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.4-3.5c0 .4 0 .8-.1 1.2l2 1.6-2 3.4-2.3-.9c-.6.5-1.3.9-2 1.2l-.4 2.4H9.4L9 18.5c-.7-.3-1.4-.7-2-1.2l-2.3.9-2-3.4 2-1.6c-.1-.4-.1-.8-.1-1.2s0-.8.1-1.2l-2-1.6 2-3.4 2.3.9c.6-.5 1.3-.9 2-1.2l.4-2.4h5.2l.4 2.4c.7.3 1.4.7 2 1.2l2.3-.9 2 3.4-2 1.6c.1.4.1.8.1 1.2Z"/></svg></button>
<button id="locate" class="locate on" type="button" aria-label="現在地に移動"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden aria-label="パネル">
  <div id="grab" class="grab" aria-label="下に引くと閉じる"><span></span></div>
  <div id="sheetbody" class="sheetbody"></div>
</section>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
